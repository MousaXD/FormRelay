name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and adversarial tests
        run: pnpm test

      - name: Build Firefox and Chromium
        run: pnpm build

      - name: Verify extension permission boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.permissions | sort) == ["activeTab", "scripting"] and
            ((.optional_permissions // []) | sort) == ["nativeMessaging"] and
            ((.host_permissions // []) | length == 0) and
            ((.optional_host_permissions // []) | length == 0) and
            ((.content_scripts // []) | length == 0) and
            (.browser_specific_settings.gecko.data_collection_permissions.required == ["none"]) and
            ((.browser_specific_settings.gecko.data_collection_permissions.optional | sort) == ["personallyIdentifyingInfo", "websiteActivity", "websiteContent"])
          ' .output/firefox-mv3/manifest.json >/dev/null

          jq -e '
            (.permissions | sort) == ["activeTab", "scripting"] and
            ((.optional_permissions // []) | sort) == ["nativeMessaging"] and
            ((.host_permissions // []) | length == 0) and
            ((.optional_host_permissions // []) | length == 0) and
            ((.content_scripts // []) | length == 0)
          ' .output/chrome-mv3/manifest.json >/dev/null

      - name: Real-browser extension smoke tests
        run: pnpm test:e2e

      - name: Package ready builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          mkdir -p ready
          (
            cd .output/firefox-mv3
            zip -qr "../../ready/FormRelay-v${VERSION}-firefox-unsigned.zip" .
          )
          (
            cd .output/chrome-mv3
            zip -qr "../../ready/FormRelay-v${VERSION}-chromium.zip" .
          )
          (
            cd ready
            sha256sum *.zip > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload ready builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formrelay-ready-builds
          path: ready/
          if-no-files-found: error
          retention-days: 30

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0

      - name: Install MCP dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: MCP unit and transport tests
        run: npm test

      - name: Check MCP source syntax
        shell: bash
        run: |
          set -euo pipefail
          find bin src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

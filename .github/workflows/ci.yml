name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and adversarial tests
        run: pnpm test

      - name: Build Firefox and Chromium
        run: pnpm build

      - name: Real-browser extension smoke tests
        run: pnpm test:e2e

      - name: Package ready builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          mkdir -p ready
          (
            cd .output/firefox-mv3
            zip -qr "../../ready/FormRelay-v${VERSION}-firefox-unsigned.zip" .
          )
          (
            cd .output/chrome-mv3
            zip -qr "../../ready/FormRelay-v${VERSION}-chromium.zip" .
          )
          (
            cd ready
            sha256sum *.zip > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload ready builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formrelay-ready-builds
          path: ready/
          if-no-files-found: error
          retention-days: 30

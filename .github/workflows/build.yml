name: Release builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - updates.json

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Firefox and Chromium
        run: pnpm build

      - name: Package release files and AMO metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAG="v${VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${TAG}." >&2
            exit 1
          fi

          mkdir -p ready
          (
            cd .output/firefox-mv3
            zip -qr "../../ready/FormRelay-${TAG}-firefox-submission.zip" .
          )
          (
            cd .output/chrome-mv3
            zip -qr "../../ready/FormRelay-${TAG}-chromium.zip" .
          )
          git archive --format=zip --output="ready/FormRelay-${TAG}-source.zip" HEAD

          node <<'NODE'
          const fs = require('fs');
          const licenseText = fs.readFileSync('LICENSE', 'utf8');
          const metadata = {
            default_locale: 'en-US',
            name: { 'en-US': 'FormRelay' },
            summary: {
              'en-US': 'Export web forms to structured JSON and safely fill them back after review.'
            },
            description: {
              'en-US': 'FormRelay is a local-first browser extension that turns webpage forms into structured, versioned JSON and safely applies completed JSON back after explicit review. It has no backend, accounts, telemetry, analytics, or direct AI API connection. Existing values are not exported by default, sensitive fields are excluded, and FormRelay never automatically submits forms.'
            },
            categories: ['other'],
            tags: ['privacy'],
            homepage: { 'en-US': 'https://github.com/MousaXD/FormRelay' },
            support_email: { 'en-US': 'mousashriteh0@gmail.com' },
            requires_payment: false,
            is_experimental: false,
            version: {
              custom_license: {
                name: { 'en-US': 'PolyForm Noncommercial License 1.0.0' },
                text: { 'en-US': licenseText }
              },
              approval_notes: 'Build with Node.js 22.13.0+ and pnpm 11.23.0: pnpm install --frozen-lockfile && pnpm build:firefox. Output: .output/firefox-mv3/. FormRelay application code does not use eval/Function/dangerouslySetInnerHTML. Validator warnings for Function/innerHTML originate from bundled Zod/React dependency internals. Imported JSON is strictly schema validated and FormRelay never auto-submits forms. See AMO-BUILD.md in the uploaded source archive.'
            }
          };
          fs.writeFileSync('amo-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Determine whether this version is new
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Mozilla publishing credentials
        if: steps.release_state.outputs.is_new == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEB_EXT_API_KEY}" || -z "${WEB_EXT_API_SECRET}" ]]; then
            echo "::error::Repository Actions secrets AMO_JWT_ISSUER and AMO_JWT_SECRET are required to publish a listed Firefox version."
            exit 1
          fi

      - name: Submit listed Firefox version to Mozilla Add-ons
        if: steps.release_state.outputs.is_new == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx web-ext@10.5.0 sign \
            --channel=listed \
            --source-dir=.output/firefox-mv3 \
            --upload-source-code="ready/FormRelay-${TAG}-source.zip" \
            --amo-metadata=amo-metadata.json \
            --approval-timeout=0 \
            --timeout=300000 \
            --no-input

      - name: Finalize checksums and release notes
        env:
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd ready
            sha256sum FormRelay-* > SHA256SUMS.txt
          )

          cat > release-notes.md <<EOF
          ## Release builds

          - **Firefox:** version **${TAG}** has been submitted to the public Mozilla Add-ons listed channel. Once Mozilla publishes it, Firefox users should install and update FormRelay through AMO.
          - **Firefox submission package:** **FormRelay-${TAG}-firefox-submission.zip** is the exact package sent to Mozilla. It is not intended for permanent direct installation.
          - **Chromium / Chrome / Edge:** extract **FormRelay-${TAG}-chromium.zip**, enable Developer mode, choose **Load unpacked**, and select the extracted folder.
          - **Mozilla reviewer source:** **FormRelay-${TAG}-source.zip** reproduces the Firefox build using the instructions in **AMO-BUILD.md**.
          - **SHA256SUMS.txt** contains checksums for the release artifacts.

          FormRelay never auto-submits forms. Review imported changes before filling and submit the webpage yourself.

          Full changelog: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: formrelay-${{ steps.package.outputs.tag }}-release-builds
          path: ready/
          if-no-files-found: error
          retention-days: 90

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          IS_NEW: ${{ steps.release_state.outputs.is_new }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$IS_NEW" == "true" ]]; then
            gh release create "$TAG" ready/* \
              --target "$GITHUB_SHA" \
              --title "FormRelay $TAG" \
              --notes-file release-notes.md
          else
            gh release edit "$TAG" --notes-file release-notes.md
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              gh release upload "$TAG" ready/* --clobber
            else
              echo "Release $TAG already exists; versioned assets were not replaced from an ordinary main push."
            fi
          fi

name: Release builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - updates.json

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    environment: mozilla-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and adversarial tests
        run: pnpm test

      - name: Build Firefox and Chromium
        run: pnpm build

      - name: Real-browser extension smoke tests
        run: pnpm test:e2e

      - name: Package release files and AMO metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAG="v${VERSION}"

          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checked-out commit does not match GITHUB_SHA."
            exit 1
          fi

          mkdir -p ready
          (
            cd .output/firefox-mv3
            zip -qr "../../ready/FormRelay-${TAG}-firefox-submission.zip" .
          )
          (
            cd .output/chrome-mv3
            zip -qr "../../ready/FormRelay-${TAG}-chromium.zip" .
          )
          git archive --format=zip --output="ready/FormRelay-${TAG}-source.zip" HEAD

          FIREFOX_VERSION="$(unzip -p "ready/FormRelay-${TAG}-firefox-submission.zip" manifest.json | jq -r '.version')"
          CHROMIUM_VERSION="$(unzip -p "ready/FormRelay-${TAG}-chromium.zip" manifest.json | jq -r '.version')"
          SOURCE_VERSION="$(unzip -p "ready/FormRelay-${TAG}-source.zip" package.json | jq -r '.version')"
          for BUILT_VERSION in "$FIREFOX_VERSION" "$CHROMIUM_VERSION" "$SOURCE_VERSION"; do
            if [[ "$BUILT_VERSION" != "$VERSION" ]]; then
              echo "::error::Artifact version ${BUILT_VERSION} does not match package.json ${VERSION}."
              exit 1
            fi
          done

          cat > ready/PROVENANCE.txt <<EOF
          FormRelay release provenance
          version=${VERSION}
          tag=${TAG}
          commit=${GITHUB_SHA}
          repository=${GITHUB_REPOSITORY}
          node=22.13.0
          pnpm=11.23.0
          web-ext=10.5.0
          EOF

          node <<'NODE'
          const fs = require('fs');
          const licenseText = fs.readFileSync('LICENSE', 'utf8');
          const metadata = {
            default_locale: 'en-US',
            name: { 'en-US': 'FormRelay' },
            summary: {
              'en-US': 'Export web forms to structured JSON and safely fill them back after review.'
            },
            description: {
              'en-US': 'FormRelay is a local-first browser extension that turns webpage forms into structured, versioned JSON and safely applies completed JSON back after explicit review. It has no backend, accounts, telemetry, analytics, or direct AI API connection. Existing values are not exported by default, sensitive fields are excluded, and FormRelay never automatically submits forms.'
            },
            categories: ['other'],
            tags: ['privacy'],
            homepage: { 'en-US': 'https://github.com/MousaXD/FormRelay' },
            support_email: { 'en-US': 'mousashriteh0@gmail.com' },
            requires_payment: false,
            is_experimental: false,
            version: {
              custom_license: {
                name: { 'en-US': 'PolyForm Noncommercial License 1.0.0' },
                text: { 'en-US': licenseText }
              },
              approval_notes: 'Build with Node.js 22.13.0+ and pnpm 11.23.0: pnpm install --frozen-lockfile && pnpm build:firefox. Output: .output/firefox-mv3/. FormRelay application code does not use eval/Function/dangerouslySetInnerHTML. Validator warnings for Function/innerHTML originate from bundled Zod/React dependency internals. Imported JSON is strictly schema validated and FormRelay never auto-submits forms. See AMO-BUILD.md in the uploaded source archive.'
            }
          };
          fs.writeFileSync('amo-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Enforce immutable release identity
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_EXISTS=false
          TAG_EXISTS=false
          gh release view "$TAG" >/dev/null 2>&1 && RELEASE_EXISTS=true
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1 && TAG_EXISTS=true

          PREVIOUS_VERSION=""
          if git rev-parse -q --verify "${GITHUB_SHA}^" >/dev/null; then
            PREVIOUS_VERSION="$(git show "${GITHUB_SHA}^:package.json" 2>/dev/null | jq -r '.version // empty' || true)"
          fi

          if [[ "$RELEASE_EXISTS" == "true" || "$TAG_EXISTS" == "true" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && "$PREVIOUS_VERSION" == "$VERSION" && "$RELEASE_EXISTS" == "true" && "$TAG_EXISTS" == "true" ]]; then
              echo "Existing ${TAG} is immutable; this main push does not change the version, so publishing is skipped."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::${TAG} already has a tag or release. Published versions are immutable; bump package.json instead of replacing assets."
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Require Mozilla publishing credentials
        if: steps.release_state.outputs.publish == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEB_EXT_API_KEY}" || -z "${WEB_EXT_API_SECRET}" ]]; then
            echo "::error::The mozilla-release environment must provide AMO_JWT_ISSUER and AMO_JWT_SECRET."
            exit 1
          fi

      - name: Freeze release tag at tested commit
        if: steps.release_state.outputs.publish == 'true'
        env:
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Published tag does not resolve to the tested commit."
            exit 1
          fi

      - name: Submit listed Firefox version to Mozilla Add-ons
        if: steps.release_state.outputs.publish == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec web-ext sign \
            --channel=listed \
            --source-dir=.output/firefox-mv3 \
            --upload-source-code="ready/FormRelay-${TAG}-source.zip" \
            --amo-metadata=amo-metadata.json \
            --approval-timeout=0 \
            --timeout=300000 \
            --no-input

      - name: Finalize and verify artifact checksums
        env:
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd ready
            sha256sum FormRelay-* PROVENANCE.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          cat > release-notes.md <<EOF
          ## Release builds

          - **Firefox:** version **${TAG}** is submitted to the public Mozilla Add-ons listed channel. Once Mozilla publishes it, Firefox users install and update FormRelay through AMO.
          - **Firefox submission snapshot:** **FormRelay-${TAG}-firefox-submission.zip** contains the tested Firefox build tree used for the AMO submission. It is not intended for permanent direct installation.
          - **Chromium / Chrome / Edge:** extract **FormRelay-${TAG}-chromium.zip**, enable Developer mode, choose **Load unpacked**, and select the extracted folder.
          - **Mozilla reviewer source:** **FormRelay-${TAG}-source.zip** reproduces the Firefox build using **AMO-BUILD.md**.
          - **PROVENANCE.txt** binds this release to the tested commit and pinned toolchain.
          - **SHA256SUMS.txt** contains verified checksums for the release artifacts.

          FormRelay never auto-submits forms. Review imported changes before filling and submit the webpage yourself.
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formrelay-${{ steps.package.outputs.tag }}-release-builds
          path: ready/
          if-no-files-found: error
          retention-days: 90

      - name: Create immutable GitHub release
        if: steps.release_state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} appeared after the immutability check; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" ready/* \
            --verify-tag \
            --title "FormRelay $TAG" \
            --notes-file release-notes.md

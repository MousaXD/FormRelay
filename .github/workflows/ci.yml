name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Firefox and Chromium
        run: pnpm build

      - name: Package ready builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          mkdir -p ready
          (
            cd .output/firefox-mv3
            zip -qr "../../ready/FormRelay-v${VERSION}-firefox-unsigned.zip" .
          )
          (
            cd .output/chrome-mv3
            zip -qr "../../ready/FormRelay-v${VERSION}-chromium.zip" .
          )
          (
            cd ready
            sha256sum *.zip > SHA256SUMS.txt
          )

      - name: Upload ready builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: formrelay-ready-builds
          path: ready/
          if-no-files-found: error
          retention-days: 30

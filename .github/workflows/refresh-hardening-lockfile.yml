name: Refresh hardening lockfile

on:
  push:
    branches: [harden/v0.1.6-form-safety]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: harden/v0.1.6-form-safety

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore: refresh hardening lockfile"
            git push origin HEAD:harden/v0.1.6-form-safety
          fi
